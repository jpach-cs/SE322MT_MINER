name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cppcheck:
    name: make lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version

      - name: Run make lint
        run: make lint
